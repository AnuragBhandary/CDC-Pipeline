[project]
name = "cdcpipe"
version = "1.0.0"
description = "Change data capture from MySQL to PostgreSQL: binlog -> Debezium -> Kafka -> an idempotent, schema-evolving Python sink, verified by per-table checksums."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Anurag Bhandary" }]
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "orjson>=3.10",
    "httpx>=0.27",
]

[project.scripts]
cdcpipe = "cdcpipe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pymysql>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdcpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs the docker compose stack (make up)"]

[tool.coverage.run]
source = ["cdcpipe"]
omit = ["*/cdcpipe/__main__.py"]
branch = true
concurrency = ["thread", "multiprocessing"]
parallel = true
# Measure the sink processes the integration tests start (they exit cleanly on SIGTERM).
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.12"
packages = ["cdcpipe"]
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_missing_imports = true
